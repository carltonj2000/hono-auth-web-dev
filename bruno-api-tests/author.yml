info:
  name: author
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiPath}}/authors/{{id}}"
  auth: inherit

runtime:
  variables:
    - name: id
      value: "1"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: ""
        method: jsonq
      variable:
        name: name
        scope: runtime
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
